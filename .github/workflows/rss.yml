name: Générer les flux RSS

on:
  schedule:
    # Tous les jours à 7h38 UTC, soit 8h38 en hiver et 9h38 en été à Paris
    - cron: "28 7 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-feeds
  cancel-in-progress: false

jobs:
  build-feeds:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Synchroniser la branche
        run: git pull --ff-only origin main

      - name: Générer le feed
        run: python giboire_blog_rss.py

      - name: Committer les feeds mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- feed.xml state.json feed_blog.xml state_blog.json

          if git diff --cached --quiet; then
            echo "Aucune modification à committer."
            exit 0
          fi

          git commit -m "MAJ feeds $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

          
